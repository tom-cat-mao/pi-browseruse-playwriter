name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # Generate playwright injected sources and build the local playwright-core
      # fork before anything imports it (missing setup breaks builds).
      - name: Bootstrap playwright fork
        run: |
          node playwright/utils/generate_injected.js
          node playwright/packages/playwright-core/build.mjs
      - name: Typecheck runtime
        run: pnpm --filter @tom-cat/pi-browser-runtime typecheck
      - name: Build runtime package
        run: pnpm --filter @tom-cat/pi-browser-runtime build
      - name: Distribution smoke check
        run: pnpm --filter @tom-cat/pi-browser-runtime smoke
      # Browser-free tests only. Chrome tests are a separate, user-authorized phase.
      - name: Runtime unit tests (no browser)
        run: pnpm --filter @tom-cat/pi-browser-runtime test:unit
      - name: Extension tests (no browser)
        run: pnpm --filter mcp-extension test
      - name: Pi package tests
        run: pnpm --filter @tom-cat/pi-browser-use-extension test
      - name: Pi load check
        run: pnpm --filter @tom-cat/pi-browser-use-extension load-check
      - name: Typecheck extension
        run: pnpm --filter mcp-extension exec tsc --project .
      - name: Typecheck pi package
        run: pnpm --filter @tom-cat/pi-browser-use-extension typecheck
